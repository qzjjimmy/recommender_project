<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1ece3" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171614" />
  <title>{% block title %}推荐系统实践{% endblock %}</title>
  <style>
    /* ==========================================================================
       设计基线（观感参考 Collective OS）
       底色：暖米纸，上浅下深，带极淡的竖向褶皱，不用纯色块平铺
       导航：悬浮的墨色胶囊，压在纸面上；内容从它下面滚过去，不切一条实心色带
       卡片：白色大圆角面板，发丝级描边 + 柔和投影，层次只要一层
       排版：系统无衬线；大标题收紧字距，正文放宽行高，数字用等宽字形
       圆角：卡片 24 / 区块与输入 16 / 可点元素一律胶囊，全站就这一套
       强调色：只用一个鼠尾草绿，其余靠墨色与中性暖灰拉层级
       反馈：pointer-down 立刻回应（:active），悬停只轻微上浮
       无障碍：跟随系统深色模式，并尊重 reduce motion / reduce transparency / contrast
       ========================================================================== */
    :root {
      color-scheme: light dark;

      /* 画布与面板 */
      --canvas: #f1ece3;
      --canvas-deep: #e7e0d3;
      --card: #ffffff;
      --card-sunken: #f6f2ea;
      --card-hover: #fffdf9;

      /* 文字 */
      --ink: #1c1b18;
      --ink-soft: #5b564d;
      --ink-faint: #8b8478;

      /* 描边 */
      --line: rgba(28, 27, 24, .10);
      --line-strong: rgba(28, 27, 24, .18);

      /* 唯一强调色：鼠尾草绿 */
      --accent: #4f6b45;
      --accent-deep: #3d5535;
      --accent-soft: rgba(79, 107, 69, .12);
      --ok: #3f7047;
      --ok-soft: rgba(79, 107, 69, .13);
      --bad: #9d4a3c;
      --bad-soft: rgba(157, 74, 60, .12);
      --warn: #7d6420;
      --warn-soft: rgba(125, 100, 32, .14);

      /* 主操作按钮 */
      --action-bg: #1c1b18;
      --action-bg-hi: #2b2925;
      --action-fg: #f7f4ee;

      /* 悬浮导航胶囊 */
      --nav-bg: #1c1b18;
      --nav-fg: rgba(247, 244, 238, .74);
      --nav-fg-strong: #ffffff;
      --nav-hover: rgba(247, 244, 238, .10);
      --nav-active: rgba(247, 244, 238, .16);
      --nav-line: rgba(247, 244, 238, .12);

      /* 圆角：一套 */
      --r-card: 24px;
      --r-block: 16px;
      --r-sm: 12px;
      --r-pill: 999px;

      /* 投影：给暖底染过色，不用纯黑 */
      --shadow-card: 0 1px 2px rgba(28, 27, 24, .04), 0 12px 30px rgba(28, 27, 24, .06);
      --shadow-lift: 0 2px 6px rgba(28, 27, 24, .05), 0 20px 44px rgba(28, 27, 24, .10);
      --shadow-nav: 0 10px 30px rgba(28, 27, 24, .22), 0 2px 6px rgba(28, 27, 24, .14);
      --shadow-action: 0 1px 2px rgba(28, 27, 24, .14), 0 8px 20px rgba(28, 27, 24, .18);

      --ease: cubic-bezier(.32, .72, 0, 1);
      --ease-spring: cubic-bezier(.34, 1.28, .64, 1);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #171614;
        --canvas-deep: #121110;
        --card: #211f1c;
        --card-sunken: #2a2724;
        --card-hover: #262320;

        --ink: #f3efe8;
        --ink-soft: #aca69c;
        --ink-faint: #837d74;

        --line: rgba(243, 239, 232, .10);
        --line-strong: rgba(243, 239, 232, .20);

        --accent: #9cb98d;
        --accent-deep: #b3cca5;
        --accent-soft: rgba(156, 185, 141, .16);
        --ok: #9cb98d;
        --ok-soft: rgba(156, 185, 141, .16);
        --bad: #e0917f;
        --bad-soft: rgba(224, 145, 127, .16);
        --warn: #d9bc7a;
        --warn-soft: rgba(217, 188, 122, .16);

        --action-bg: #f3efe8;
        --action-bg-hi: #ffffff;
        --action-fg: #1c1b18;

        --nav-bg: #262421;
        --nav-fg: rgba(243, 239, 232, .70);
        --nav-fg-strong: #f3efe8;
        --nav-hover: rgba(243, 239, 232, .08);
        --nav-active: rgba(243, 239, 232, .14);
        --nav-line: rgba(243, 239, 232, .12);

        --shadow-card: 0 1px 2px rgba(0, 0, 0, .34), 0 14px 32px rgba(0, 0, 0, .28);
        --shadow-lift: 0 2px 8px rgba(0, 0, 0, .40), 0 22px 48px rgba(0, 0, 0, .36);
        --shadow-nav: 0 12px 34px rgba(0, 0, 0, .48), 0 2px 6px rgba(0, 0, 0, .36);
        --shadow-action: 0 1px 2px rgba(0, 0, 0, .40), 0 8px 22px rgba(0, 0, 0, .40);
      }
    }
    /* 旧变量名保留为别名：早期写法仍在用，指向同一套新值 */
    :root {
      --bg: var(--canvas);
      --bg-tint: var(--canvas);
      --fill-quaternary: var(--card-sunken);
      --fill-tertiary: color-mix(in srgb, var(--ink) 9%, transparent);
      --fill-secondary: color-mix(in srgb, var(--ink) 14%, transparent);
      --text: var(--ink);
      --text-secondary: var(--ink-soft);
      --muted: var(--ink-faint);
      --hairline: var(--line);
      --brand: var(--accent);
      --brand-dark: var(--accent-deep);
      --brand-soft: var(--accent-soft);
      --radius-xl: var(--r-card);
      --radius: var(--r-block);
      --radius-sm: var(--r-sm);
      --radius-pill: var(--r-pill);
      --shadow: var(--shadow-card);
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; padding: 0 18px 72px; background: var(--canvas); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display",
                   "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei UI",
                   "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, system-ui, sans-serif;
      font-size: 15px; line-height: 1.6;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
    /* 纸面质感：顶部一层暖光 + 极淡的竖向褶皱。两层都固定在视口上，滚动的只有内容 */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(118% 74% at 50% -6%, rgba(255, 255, 255, .82), rgba(255, 255, 255, 0) 60%),
        linear-gradient(180deg, var(--canvas) 0%, var(--canvas-deep) 100%);
    }
    body::after {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .5;
      background: repeating-linear-gradient(
        90deg,
        rgba(255, 255, 255, .62) 0 1.5px,
        rgba(255, 255, 255, 0) 1.5px 46px
      );
    }
    @media (prefers-color-scheme: dark) {
      body::before {
        background:
          radial-gradient(118% 74% at 50% -6%, rgba(255, 255, 255, .07), rgba(255, 255, 255, 0) 60%),
          linear-gradient(180deg, var(--canvas) 0%, var(--canvas-deep) 100%);
      }
      body::after { opacity: .08; }
    }
    .wrap { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; }

    /* ---------- 顶部导航：悬浮的墨色胶囊 ---------- */
    .topbar { position: sticky; top: 14px; z-index: 40; max-width: 1080px; margin: 14px auto 26px; }
    .topnav {
      display: flex; align-items: center; gap: 4px;
      height: 56px; padding: 0 10px 0 12px; border-radius: var(--r-pill);
      background: var(--nav-bg); box-shadow: var(--shadow-nav);
    }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-right: 12px;
      color: var(--nav-fg-strong); text-decoration: none;
      font-size: 14.5px; font-weight: 600; letter-spacing: -.012em; white-space: nowrap;
    }
    .brand .dot {
      width: 26px; height: 26px; flex: 0 0 auto; border-radius: 9px;
      display: inline-grid; place-items: center;
      background: var(--nav-fg-strong); color: var(--nav-bg);
      font-size: 13px; font-weight: 700; letter-spacing: 0;
    }
    .topnav a.navlink {
      color: var(--nav-fg); text-decoration: none; font-size: 14px; letter-spacing: -.004em;
      padding: 7px 14px; border-radius: var(--r-pill); white-space: nowrap;
      transition: background .26s var(--ease), color .26s var(--ease), transform .18s var(--ease);
    }
    .topnav a.navlink:hover { background: var(--nav-hover); color: var(--nav-fg-strong); }
    .topnav a.navlink:active { transform: scale(.96); }
    .topnav a.navlink.active {
      background: var(--nav-active); color: var(--nav-fg-strong); font-weight: 600;
    }
    .topnav .spacer { flex: 1; }
    .topnav .who-line {
      display: inline-flex; align-items: center; padding-left: 12px; margin-right: 2px;
      border-left: 1px solid var(--nav-line);
    }
    .topnav .who {
      font-size: 13px; color: var(--nav-fg); white-space: nowrap;
      max-width: 14ch; overflow: hidden; text-overflow: ellipsis;
    }

    /* ---------- 标题与正文 ---------- */
    h1 {
      font-size: clamp(28px, 3.4vw, 38px); font-weight: 600; line-height: 1.08;
      letter-spacing: -.026em; margin: 0 0 10px;
      text-wrap: balance;
    }
    .sub {
      color: var(--ink-soft); font-size: 15px; line-height: 1.65;
      margin-bottom: 26px; max-width: 68ch;
      text-wrap: balance;
    }
    .muted { color: var(--ink-faint); font-size: 13px; letter-spacing: .004em; line-height: 1.7; }
    b, strong { font-weight: 600; }

    /* ---------- 图标：统一尺寸与笔画，跟着文字颜色走 ---------- */
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ico {
      width: 1.05em; height: 1.05em; flex: 0 0 auto;
      display: inline-block; vertical-align: -.16em;
      stroke-width: 1.7;
    }
    .ico-lg { width: 18px; height: 18px; }

    /* ---------- 页面级加载指示：提交表单后亮起一条细线，比转圈更安静 ---------- */
    .loadbar {
      position: fixed; left: 0; right: 0; top: 0; height: 3px; z-index: 60;
      pointer-events: none; opacity: 0; transition: opacity .2s var(--ease);
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      background-size: 38% 100%; background-repeat: no-repeat;
      animation: loadbar-run 1.1s linear infinite;
    }
    .loadbar.on { opacity: 1; }
    @keyframes loadbar-run {
      from { background-position: -40% 0; }
      to   { background-position: 140% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loadbar { animation: none; background: var(--accent); background-size: 100% 100%; }
    }

    /* ---------- 卡片：白色大圆角面板 ---------- */
    .card {
      position: relative; background: var(--card); border: 1px solid var(--line);
      border-radius: var(--r-card); padding: 24px; margin-bottom: 18px;
      box-shadow: var(--shadow-card);
    }
    @keyframes materialize {
      from { opacity: 0; transform: translateY(10px) scale(.995); }
      to   { opacity: 1; transform: none; }
    }
    /* 用 backwards 而不是 both：动画没跑起来（或被打断）时，卡片是可见的而不是停在起始的透明态 */
    .wrap > .card { animation: materialize .5s var(--ease) backwards; }
    .wrap > .card:nth-of-type(2) { animation-delay: .05s; }
    .wrap > .card:nth-of-type(3) { animation-delay: .1s; }
    .wrap > .card:nth-of-type(4) { animation-delay: .15s; }

    /* 卡片内小标题：不加大字号，只加字重和收紧 */
    .card-title { font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; }

    /* ---------- 表单控件 ---------- */
    label {
      display: block; font-size: 12px; font-weight: 600; color: var(--ink-soft);
      margin-bottom: 7px; letter-spacing: .01em;
    }
    input, select, textarea {
      padding: 12px 15px; border: 1px solid var(--line); border-radius: var(--r-block);
      font-size: 15px; font-family: inherit; background: var(--card-sunken); color: var(--ink);
      transition: border-color .24s var(--ease), box-shadow .24s var(--ease), background .24s var(--ease);
    }
    input::placeholder, textarea::placeholder { color: var(--ink-faint); opacity: 1; }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--accent); background: var(--card);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    :is(a, button, input, select, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--accent); outline-offset: 2px;
    }

    /* ---------- 按钮：胶囊形；主按钮墨色实心，按下即回弹 ---------- */
    button {
      padding: 12px 22px; border: 1px solid transparent; border-radius: var(--r-pill);
      font-family: inherit; font-size: 15px; font-weight: 500; letter-spacing: -.004em;
      color: var(--action-fg); cursor: pointer; background: var(--action-bg);
      box-shadow: var(--shadow-action);
      transition: transform .16s var(--ease), box-shadow .24s var(--ease),
                  background .24s var(--ease), color .24s var(--ease), opacity .24s var(--ease);
    }
    button:hover { background: var(--action-bg-hi); }
    button:active { transform: scale(.97); }
    button:disabled { opacity: .40; cursor: not-allowed; transform: none; box-shadow: none; }
    button.ghost {
      background: var(--card); color: var(--ink); border-color: var(--line-strong);
      font-weight: 500; box-shadow: none;
    }
    button.ghost:hover { background: var(--card-hover); border-color: var(--ink-faint); }

    /* ---------- 表格 ---------- */
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td {
      text-align: left; padding: 12px 8px; border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    th { font-size: 12px; color: var(--ink-faint); font-weight: 600; letter-spacing: .01em; }
    tr:last-child td { border-bottom: 0; }

    /* ---------- 小元素 ---------- */
    .tag {
      display: inline-block; padding: 3px 11px; border-radius: var(--r-pill);
      background: var(--card-sunken); color: var(--ink-soft);
      font-size: 12px; font-weight: 500; letter-spacing: .004em; white-space: nowrap;
      border: 1px solid var(--line);
    }
    .tag.accent { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; }
    .tag.quiet { background: transparent; color: var(--ink-faint); }
    .err { background: var(--bad-soft); border-color: var(--bad-soft); color: var(--bad); }
    .ok  { background: var(--ok-soft); border-color: var(--ok-soft); color: var(--ok); }
    code {
      background: var(--card-sunken); border: 1px solid var(--line);
      padding: 2px 8px; border-radius: 8px;
      font-family: "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px; color: var(--ink-soft); letter-spacing: -.004em;
      overflow-wrap: anywhere;
    }
    .chips {
      font-size: 13px; color: var(--ink-faint); margin-top: 15px; line-height: 2.3;
      overflow-wrap: anywhere;
    }
    .chips a {
      color: var(--ink-soft); text-decoration: none; margin-right: 8px;
      padding: 5px 13px; border-radius: var(--r-pill);
      background: var(--card-sunken); border: 1px solid var(--line); display: inline-block;
      transition: background .26s var(--ease), transform .18s var(--ease),
                  color .26s var(--ease), border-color .26s var(--ease);
    }
    .chips a:hover { background: var(--accent-soft); color: var(--accent-deep); border-color: transparent; }
    .chips a:active { transform: scale(.96); }
    {% block style %}{% endblock %}

    /* ---------- 无障碍：跟随系统偏好 ---------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important; animation-iteration-count: 1 !important;
        transition-duration: .06s !important;
      }
      button:active, .topnav a.navlink:active, .chips a:active { transform: none !important; }
    }
    @media (prefers-reduced-transparency: reduce) {
      body::after { display: none; }
    }
    @media (prefers-contrast: more) {
      /* 用 ink 混出来而不是写死黑：深色模式下描边同样看得见 */
      :root {
        --line: color-mix(in srgb, var(--ink) 52%, transparent);
        --line-strong: color-mix(in srgb, var(--ink) 70%, transparent);
      }
      .card { border-width: 1.5px; }
      body::after { display: none; }
    }
    @media (max-width: 720px) {
      body { padding: 0 14px 64px; }
      .topbar { top: 10px; margin: 10px auto 20px; }
      .topnav { height: auto; flex-wrap: wrap; padding: 10px 12px; row-gap: 6px; border-radius: 26px; }
      .brand { margin-right: 4px; }
      .topnav .who-line { border-left: 0; padding-left: 0; }
      .topnav .who { max-width: 10ch; }
      .wrap > .card { animation: none; }
      .card { padding: 18px; border-radius: 20px; }
    }
  </style>
</head>
<body>

      <path d="M7 20h10" /><path d="M9 16v4" /><path d="M15 16v4" />
      <path d="M9 12v-4" /><path d="M12 12v-1" /><path d="M15 12v-2" />
    </symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 6l-6 6l6 6" />
    </symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 6l6 6l-6 6" />
    </symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12l14 0" /><path d="M13 18l6 -6l-6 -6" />
    </symbol>
  </svg>
  <div class="loadbar" id="loadbar" aria-hidden="true"></div>
  <div class="topbar">
    <div class="topnav">
      <a href="/home" class="brand"><span class="dot">荐</span>推荐系统实践</a>
      <a href="/home" class="navlink {% if active=='home' %}active{% endif %}">推荐首页</a>
      <a href="/search" class="navlink {% if active=='search' %}active{% endif %}">智能推荐</a>
      <a href="/" class="navlink {% if active=='similar' %}active{% endif %}">相似商品</a>
      {% if is_admin %}
        <a href="/admin" class="navlink {% if active=='admin' %}active{% endif %}">用户洞察</a>
      {% endif %}
      <span class="spacer"></span>
      {% if username %}
        <span class="who-line"><span class="who">{{ display_name or username }}</span></span>
        <a href="/logout" class="navlink">退出</a>
      {% else %}
        <a href="/login" class="navlink {% if active=='login' %}active{% endif %}">登录 / 注册</a>
      {% endif %}
    </div>
  </div>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
  <script>
    (function () {
      "use strict";
      // 表单都是整页刷新：提交后先把顶部细线亮起来，避免"点了没反应"的错觉
      var bar = document.getElementById("loadbar");
      if (!bar) return;
      document.addEventListener("submit", function (event) {
        var form = event.target;
        if (form && form.tagName === "FORM") bar.classList.add("on");
      });
    })();
  </script>
  {% block script %}{% endblock %}
</body>
</html>
